name: Build ConfessWA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ConfessWA_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o ConfessWA_Android_Project.zip -d project
          PROJECT_DIR="$(dirname "$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="project"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConfessWA-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
